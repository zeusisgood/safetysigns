name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle
      - name: Build and test
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: safetysigns-jar
          path: build/libs/*.jar
