name: Release

# main に取り込まれたとき、build.gradle の version のタグ v<版> がまだなければ、
# ビルドとテストを流してから、タグと GitHub Release を作る（本文は CHANGELOG.md のその版の節、jar を添付）。
# タグがすでにあれば何もしない（版を上げていない Merge では何も起きない）。
# 流れの図は doc/diagrams/release.md。
on:
  push:
    branches: [main]

permissions:
  contents: write

# 続けて Merge しても、同じ版のリリースを 2 回作らないように 1 本ずつ流す
# （待っている古い run は新しい run に置き換わるが、新しい run が最新の main を見るので問題ない）
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: |
          version=$(sed -n "s/^version = '\(.*\)'/\1/p" build.gradle)
          if [ -z "$version" ]; then
            echo "::error::build.gradle に version = '...' が見つからない"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 終了コード 0 = タグがある、2 = ない。それ以外（通信の失敗など）は止まる
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            echo "Tag v$version already exists; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif [ "$rc" = 2 ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::タグを確かめられない（git ls-remote の終了コード $rc）"
            exit 1
          fi
      - uses: actions/setup-java@v4
        if: steps.version.outputs.new == 'true'
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle
      - name: Build and test
        # 失敗したらここで止まり、タグもリリースも作らない
        if: steps.version.outputs.new == 'true'
        run: ./gradlew build --no-daemon
      - name: Create the tag and the release
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version="$VERSION"
          jar="build/libs/safetysigns-1.12.2-$version.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::$jar がない"
            exit 1
          fi
          # CHANGELOG.md の「## <版>」から、次の「## 」の手前まで（行末の空白・CR は無視して比べる）
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="## $version" '{sub(/[ \t\r]+$/, "")} $0 == v {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md に「## $version」の節がない（または空）"
            exit 1
          fi
          # タグはこのコミットに付く（gh release create がタグも作る）
          gh release create "v$version" "$jar" \
            --title "$version" --notes-file "$notes" --target "$GITHUB_SHA"
